<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 36</title>
</head>
<style>
    #colorPreview {
        width: 200px;
        height: 200px;
        margin: 20px 0;
        border: 1px solid #000;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #colorHistory {
        list-style-type: none;
        padding: 0;
    }
    #colorHistory li {
        margin: 5px 0;
    }

</style>
<body>
    <h1>Interactive Color Picker</h1>
    <label for="colorPicker">Choose a color:</label>
    <input type="color" id="colorPicker" name="colorPicker">
    <div id="colorPreview">colorPreview</div>

    <h2>Color History</h2>
    <ul id="colorHistory"></ul>
    <button id="clearHistoryButton">Clear History</button>
</body>
<script src="./app.js"></script>
</html>
